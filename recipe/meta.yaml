{% set name = "puma" %}
{% set version = "3.2.2" %}
{% set build = 4 %}

package:
  name: {{ name|lower }}-split
  version: {{ version }}

source:
  url: https://github.com/nasa/puma/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 25308c057b36a7d394a58f3b16ede621ba739b5c504e51c069edc913f086ad7d
  patches:
    # Cython's numpy.pxd dropped int_t, so the three .pyx files that declare
    # "ctypedef np.int_t DTYPE_t" no longer cythonize. intp_t is the indexing
    # type these arrays actually hold.
    - patches/numpy2-compatibility.patch
    # PuMA asks for --std=c++0x, which is C++11. Eigen 3.4 needs C++14 and
    # Eigen 5 needs C++17, so the library is compiled at C++17 instead.
    - patches/cxx17-standard.patch

build:
  number: {{ build + 100 * (microarch_level|default(1)|int - 1) }}

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - numpy                                  # [build_platform != target_platform]
    - x86_64-microarch-level =={{ microarch_level }}  # [unix and x86_64]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - {{ compiler('cxx') }}
    - libgomp  # [linux]
    - llvm-openmp  # [osx]
    - cmake <4  # [not win]
    - make  # [not win]
    - swig  # [not win]
  host:
    - xorg-libxfixes  # [linux]
    - libgl-devel  # [linux]
    - python
    - cython
    - pip
    - setuptools
    - numpy
    - eigen  # [not win]
    - fftw  # [not win]
    - libtiff  # [not win]
    - qt-main  # [not win and qt_major == 5]
    - qt6-main  # [not win and qt_major == 6]
    - qt6-3d  # [not win and qt_major == 6]

outputs:
  - name: puma
    # qt-main is in the shared host environment so that the GUI can be
    # compiled. Only puma-gui links against it, so the library and the python
    # package keep Qt out of their run requirements.
    build:
      ignore_run_exports:
        - qt-main  # [qt_major == 5]
        - qt6-main  # [qt_major == 6]
        - qt6-3d  # [qt_major == 6]
    files:
      - bin/pumaX_testing
      - include/puma.h
      - lib/libPuMA*
      - lib/libTexGenCore*
      - share/TexGen
      # A path holding a wildcard matches the directory itself rather than what
      # is under it, so the python packages are listed with a recursive glob.
      - lib/python*/site-packages/TexGen/**
      - lib/python*/site-packages/pumapy/**
      - lib/python*/site-packages/pumapy-*/**
      - Lib/site-packages/pumapy/**        # [win]
      - Lib/site-packages/pumapy-*/**      # [win]
    # The build tools stay in the top-level requirements, which is where the
    # shared build script runs. python is named here so that the output is
    # tagged with the python version its extension modules were built for.
    requirements:
      host:
        - python
        - numpy
        - fftw  # [not win]
        - libtiff  # [not win]
      run:
        - python
        - scipy >=1.11,<2
        - scikit-image >=0.17
        - matplotlib-base
        - pyvista >=0.46.5
        - vtk
        - scikit-umfpack  # [not win]
        - ocl-icd-system  # [linux]
    test:
      imports:
        - TexGen.Core  # [not win]
        - pumapy
      source_files:
        - python/test/*.py
      commands:
        - pumaX_testing 1  # [not win]
        - cd python/test && python -m unittest test_workspace.TestWorkspace
    about:
      license: NASA-1.3
      license_file:
        - LICENSE.txt
        - install/TexGen/LICENSE.txt
      summary: PuMA library and the pumapy python package.

  - name: puma-gui  # [not win]
    files:
      - bin/pumaGUI
    requirements:
      run:
        - {{ pin_subpackage('puma', exact=True) }}
        - qt-main  # [qt_major == 5]
        - qt6-main  # [qt_major == 6]
        - qt6-3d  # [qt_major == 6]
    test:
      requires:
        - coreutils
      commands:
        # The test environment is headless, so Qt's default xcb plugin has no
        # display to connect to; offscreen is conda-forge's documented
        # substitute. pumaGUI ends in QApplication::exec() and never returns on
        # its own, so timeout stops it and --preserve-status reports the
        # resulting SIGTERM as 143.
        - QT_QPA_PLATFORM=offscreen timeout --preserve-status 10 pumaGUI || [[ $? -eq 143 ]]
    about:
      # The GUI plots through the vendored QCustomPlot, which is GPL-3.0.
      license: NASA-1.3 AND GPL-3.0-or-later
      license_file:
        - LICENSE.txt
        - gui/src/Utilities/qcustomplot/GPL.txt
      summary: Desktop GUI for PuMA.

about:
  home: https://github.com/nasa/puma
  license: NASA-1.3
  license_file:
    - LICENSE.txt
    - install/TexGen/LICENSE.txt
    - gui/src/Utilities/qcustomplot/GPL.txt
  summary: A package to compute material properties from micro-CT data.
  description: |
    The Porous Microstructure Analysis (PuMA) software has been developed to
    compute effective material properties and perform material response simulations on
    digitized microstructures of porous media. PuMA is able to import digital three-dimensional
    images obtained from X-ray microtomography or to generate artificial microstructures
    that mimic real materials. PuMA also provides a module for interactive 3D visualizations.
    Version 3 includes modules to compute simple morphological properties such as porosity,
    volume fractions, pore diameter, and specific surface area. Additional capabilities include
    the determination of effective thermal and electrical conductivity (both radiative and solid conduction - 
    including the ability to simulate local anisotropy for the latter); effective diffusivity and 
    tortuosity from the continuum to the rarefied regime; techniques to determine the local material orientation, 
    as well as the mechanical properties (elasticity coefficient), and the permeability of a material.
    Some examples of microstructures that have been run in the past are shown in the pictures below,
    together with PuMA's software architecture schematic.
    <p align="center">
      <img src="https://github.com/nasa/puma/raw/main/doc/source/puma_description.png" width="100%"></img>
    </p>

    ### Citing PuMA
    If you use PuMA in your research, please use the following BibTeX entries to cite it:

    ```BibTeX
    @article{puma2021,
      title={Update 3.0 to “PuMA: The Porous Microstructure Analysis software”,(PII: S2352711018300281)},
      author={Ferguson, Joseph C and Semeraro, Federico and Thornton, John M and Panerai, Francesco and Borner, Arnaud and Mansour, Nagi N},
      journal={SoftwareX},
      volume={15},
      pages={100775},
      year={2021},
      publisher={Elsevier}
    }
    @article{puma2018,
      title={PuMA: The porous microstructure analysis software},
      author={Ferguson, Joseph C and Panerai, Francesco and Borner, Arnaud and Mansour, Nagi N},
      journal={SoftwareX},
      volume={7},
      pages={81--87},
      year={2018},
      publisher={Elsevier}
    }
    ```

  doc_url: https://puma-nasa.readthedocs.io/
  dev_url: https://gitlab.com/jcfergus/puma-dev

extra:
  recipe-maintainers:
    - fedesemeraro
    - Tobias-Fischer
    - joseph-ferguson
